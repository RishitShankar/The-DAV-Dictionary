name: 🚀 DAV 10-Page Master Notes Cloud Generator Engine

on:
  workflow_dispatch:
  schedule:
    # Run every 6 hours automatically to ensure full continuous coverage
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  generate-chapter-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --no-audit --prefer-offline

      - name: 🚀 Launch Google Gemini 10-Page Notes Generator (Turbo Mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PACE_DELAY_MS: "8000"
        run: node scripts/generate_all_chapter_notes.js

      - name: 💾 Final Push (All Generated PDFs & Data)
        if: always()
        run: |
          git config user.name "Google Gemini Master Agent"
          git config user.email "gemini-bot@davdictionary.org"
          git add public/notes src/data/officialChapterNotesData.js scripts/notes_generation_ledger.json
          git diff --staged --quiet || (git commit -m "feat(notes): cloud run checkpoint [skip ci]" && git push origin HEAD:main)
